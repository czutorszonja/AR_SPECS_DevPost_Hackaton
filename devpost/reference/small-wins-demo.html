#small-wins-lens .sw-reward{position:absolute;left:61%;top:35%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:3px;width:max-content;max-width:48%}
#small-wins-lens .sw-moment{position:relative;--unit:clamp(34px,6.8cqw,56px);width:calc(1.92 * var(--unit));height:calc(1.60 * var(--unit))}
#small-wins-lens .sw-plate{position:absolute;left:calc(50% - var(--unit) / 2);top:0;width:var(--unit);height:var(--unit);filter:drop-shadow(0 1px 2px #675c4070)}
#small-wins-lens .sw-strip{position:absolute;left:calc(50% - var(--unit) * .66);bottom:0;width:calc(var(--unit)*1.32);height:calc(var(--unit)*.55);border:1px solid #fff5c5;padding:1px 6%;border-radius:12px;display:flex;align-items:center;justify-content:space-between;background:#f5e5b1a3;box-shadow:0 1px 2px #62543324}
#small-wins-lens .sw-strip img,#small-wins-lens .sw-outline{width:calc(var(--unit)*.46);height:calc(var(--unit)*.46)}
#small-wins-lens .sw-outline{border:1.8px dotted #967d4c;border-radius:50%}
#small-wins-lens .sw-glint{display:block;position:absolute;z-index:1;color:#fff4aa;font-style:normal;font-size:clamp(14px,3.1cqw,25px);text-shadow:0 1px 2px #987744;line-height:1}
#small-wins-lens .g1{left:9%;top:28%;transform:rotate(-9deg)}
#small-wins-lens .g2{right:8%;top:5%;transform:scale(.86)}
#small-wins-lens .g3{left:64%;top:-10%;transform:scale(.62)}
#small-wins-lens .sw-note{font-size:clamp(11px,1.8cqw,14px);line-height:1.35;font-weight:550;white-space:nowrap;letter-spacing:.005em;color:#34473c;padding:3px 8px;border-radius:8px;background:#fcf1dcd9}
#small-wins-lens .sw-stage.playing .sw-plate{animation:sw-settle 4.6s both}
#small-wins-lens .sw-stage.playing .sw-glint{animation:sw-glint .78s ease-out both}
#small-wins-lens .sw-stage.playing .g2{animation-delay:.11s}
#small-wins-lens .sw-stage.playing .g3{animation-delay:.06s}
#small-wins-lens .sw-stage.playing .sw-strip{animation:sw-in .36s .63s ease-out both}
#small-wins-lens .sw-stage.playing .sw-note{animation:sw-in .4s .25s ease-out both}
#small-wins-lens .sw-stage.playing .sw-reward{animation:sw-dissolve 4.6s both}
@keyframes sw-glint{0%{opacity:0;scale:.5}40%{opacity:1;scale:1}80%{opacity:.8;scale:1.06}100%{opacity:0;scale:1.06}}
@keyframes sw-in{from{opacity:0}to{opacity:1}}
@keyframes sw-dissolve{0%,87%{opacity:1}100%{opacity:0}}
@keyframes sw-settle{0%{opacity:0;transform:scale(.88) rotate(-5deg)}12%{opacity:1;transform:scale(1.03) rotate(1deg)}21%,35%{opacity:1;transform:scale(1) rotate(0)}54%,100%{opacity:1;transform:translate(calc(var(--unit)*.30),calc(var(--unit)*.82)) scale(.465)}}
#small-wins-lens .sw-wrist{position:absolute;left:23%;top:70%;border:1px solid #fff1cb;background:#ece2b9e6;color:#2d4c40;min-height:42px;padding:7px 12px;border-radius:9px 9px 9px 1px;display:flex;align-items:center;gap:6px;font-weight:600;box-shadow:0 1px 6px #344c3d35}
#small-wins-lens .sw-wrist svg{width:17px;height:17px}
#small-wins-lens .sw-book,#small-wins-lens .sw-quest{position:absolute;background:linear-gradient(115deg,#faf1dce8,#f5edcfea);color:#29443b;border:1px solid #fff9e1;border-radius:12px;box-shadow:0 4px 16px #2e443b29}
#small-wins-lens .sw-book{width:clamp(198px,37%,282px);left:57%;top:47%;transform:translate(-50%,-50%);padding:13px 15px}
#small-wins-lens .sw-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.2;font-size:11px;letter-spacing:.13em;font-weight:650;color:#486556}
#small-wins-lens .sw-close{border:0;background:transparent;color:#3d5144;font-size:22px;line-height:1;padding:0 3px;min-width:23px;min-height:23px}
#small-wins-lens .sw-tabs{display:flex;gap:15px;border-bottom:1px solid #a2b29b;margin-bottom:8px}
#small-wins-lens .sw-tabs button{border:0;background:transparent;color:#506657;padding:3px 0 5px;font-weight:500;line-height:1.3}
#small-wins-lens .sw-tabs button[aria-pressed=true]{border-bottom:2px solid #366952;color:#244b3c}
#small-wins-lens .sw-section{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:#4b6153;min-height:22px}
#small-wins-lens .sw-section select{color:inherit;background:transparent;border:0;font-weight:650;padding:0;max-width:110px}
#small-wins-lens .sw-count{font-variant-numeric:tabular-nums;color:#566d5c;font-size:11px}
#small-wins-lens .sw-row{display:flex;align-items:center;gap:7px;font-size:13px;line-height:1.2;min-height:28px;font-weight:450}
#small-wins-lens .sw-row span{overflow-wrap:anywhere}
#small-wins-lens .sw-row input{accent-color:#4e795e;width:15px;height:15px;flex:0 0 15px;margin:0}
#small-wins-lens .sw-add,#small-wins-lens .sw-add-form button,#small-wins-lens .sw-pager button{background:transparent;border:0;color:#35604a;font-size:12px;font-weight:600;min-height:27px;padding:4px 0}
#small-wins-lens .sw-add-form{display:flex;gap:5px;align-items:center}
#small-wins-lens .sw-add-form input{width:0;flex:1;border:1px solid #8d9e8a;background:#fff7e6;color:#233a2c;border-radius:5px;font-size:13px;padding:5px}
#small-wins-lens .sw-pager{display:flex;align-items:center;gap:6px;font-size:11px}
#small-wins-lens .sw-pager button{min-width:25px;font-size:16px}
#small-wins-lens .sw-album-art{display:flex;flex-wrap:wrap;gap:7px;padding:6px 0;align-items:center;font-size:12px}
#small-wins-lens .sw-album-art img{width:45px;height:45px;object-fit:contain}
#small-wins-lens .sw-album-art .sw-custom{color:#b47343;font-size:28px}
#small-wins-lens .sw-quest{left:66%;top:32%;padding:11px 13px;max-width:31%}
#small-wins-lens .sw-quest-title{font-size:clamp(15px,2.5cqw,20px);font-weight:550;line-height:1.14;margin:7px 0}
#small-wins-lens .sw-quest-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#small-wins-lens .sw-quest-actions button{padding:5px 6px;border-radius:5px;border:0;background:transparent;color:#486354;font-size:12px}
#small-wins-lens .sw-quest-actions button:first-child{background:#e0db9e;color:#36483c}
#small-wins-lens .sw-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
#small-wins-lens .sw-scenes{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
#small-wins-lens .sw-scenes button,#small-wins-lens .sw-action{background:transparent;color:var(--soft-ink);padding:7px 9px;line-height:1.25;border:1px solid transparent;border-radius:8px;font-size:13px;font-weight:500}
#small-wins-lens .sw-scenes button[aria-pressed=true]{background:var(--selected);color:var(--selected-type)}
#small-wins-lens .sw-action{border-color:var(--rule);color:var(--ink)}
#small-wins-lens .sw-action:disabled{opacity:.7}
#small-wins-lens .sw-status{margin-top:7px;font-size:13px;line-height:1.45;color:var(--soft-ink)}
@media(max-width:500px){
#small-wins-lens .sw-book{padding:8px 11px;left:55%;top:48%}
#small-wins-lens .sw-quest{left:64%;top:28%;padding:7px 8px;max-width:34%}
#small-wins-lens .sw-quest .sw-kicker{letter-spacing:.04em}
#small-wins-lens .sw-scenes{gap:1px}#small-wins-lens .sw-scenes button{padding:7px}
}
@media(max-width:420px){
#small-wins-lens .sw-stage{aspect-ratio:1.32}
#small-wins-lens .sw-landscape{background-size:cover}
#small-wins-lens .sw-book{width:206px}
}
@media(pointer:coarse){#small-wins-lens .sw-scenes button,#small-wins-lens .sw-action,#small-wins-lens .sw-wrist{min-height:44px}#small-wins-lens .sw-book{width:clamp(206px,42%,282px)}#small-wins-lens .sw-row{min-height:33px}}
@media(prefers-reduced-motion:reduce){
#small-wins-lens .sw-stage.playing .sw-plate{animation:none;transform:translate(calc(var(--unit)*.30),calc(var(--unit)*.82)) scale(.465)}
#small-wins-lens .sw-stage.playing .sw-glint{display:none}
#small-wins-lens .sw-stage.playing .sw-strip,#small-wins-lens .sw-stage.playing .sw-note{animation:none}
}

#small-wins-lens .sw-hand{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#small-wins-lens .sw-wrist{left:17%;top:81%;font-size:12px;min-height:30px}
#small-wins-lens .sw-note,#small-wins-lens .sw-strip{background:#33584be8;color:#fff6dc}
#small-wins-lens .sw-outline{border-color:#e3d9a7}
#small-wins-lens .sw-book,#small-wins-lens .sw-quest{background:linear-gradient(115deg,#264f48f0,#2a5146ed);color:#fff7df}
#small-wins-lens .sw-kicker,#small-wins-lens .sw-count{color:#d9dfc6}
#small-wins-lens .sw-close,#small-wins-lens .sw-tabs button,#small-wins-lens .sw-tabs button[aria-pressed=true],#small-wins-lens .sw-section,#small-wins-lens .sw-add,#small-wins-lens .sw-add-form button,#small-wins-lens .sw-pager button,#small-wins-lens .sw-quest-actions button{color:#fff3d6}
#small-wins-lens .sw-tabs button[aria-pressed=true]{border-color:#fbdf99}
#small-wins-lens .sw-section select option{background:#335749}
#small-wins-lens .sw-quest-actions button:first-child{color:#314e40}
#small-wins-lens .sw-row-art{height:22px;width:22px;object-fit:contain;margin-left:auto;flex:0 0 auto}
#small-wins-lens .sw-row-art.pending{filter:grayscale(1);opacity:.5}
@media(pointer:coarse){#small-wins-lens .sw-wrist{min-height:44px}}

#small-wins-lens{margin:0 auto;--ink:#24473e;--soft-ink:#4a6358;--rule:#b4c4b6;--selected:#244e44;--selected-type:#fff9e9}
#small-wins-lens .sw-heading{margin:0 0 16px}
#small-wins-lens .sw-overline{color:#8a5733;letter-spacing:.15em;font-size:11px;font-weight:700}
#small-wins-lens .sw-heading h1{margin:3px 0 0;font:normal clamp(34px,5vw,49px)/1.05 Georgia,serif;color:#23483d;letter-spacing:-.035em}
#small-wins-lens button,#small-wins-lens select,#small-wins-lens label:has(input[type="checkbox"]){cursor:pointer}
#small-wins-lens button:disabled{cursor:default}
#small-wins-lens .sw-play-controls,#small-wins-lens .sw-boost-label{display:flex;align-items:center;gap:7px}
#small-wins-lens .sw-boost-label{font-size:13px;color:#405b4d;min-height:36px}
#small-wins-lens .sw-boost{accent-color:#336348}
#small-wins-lens .sw-boost-label[hidden]+.sw-action[hidden]{display:none}
#small-wins-lens .sw-extra,#small-wins-lens .sw-halo{display:none}
#small-wins-lens .sw-book.editing .sw-rows,#small-wins-lens .sw-book.editing .sw-pager,#small-wins-lens .sw-book.editing .sw-today>.sw-section{display:none}
#small-wins-lens .sw-add-form{display:grid;gap:6px}
#small-wins-lens .sw-add-form label{display:grid;gap:2px;font-size:11px;color:#f2efd6}
#small-wins-lens .sw-add-form input,#small-wins-lens .sw-add-form select{box-sizing:border-box;width:100%;background:#f9f4e1;border:1px solid #c8d6be;color:#2b493c;border-radius:5px;padding:4px 6px;font:13px/1.2 system-ui}
#small-wins-lens .sw-form-actions{display:flex;gap:16px;align-items:center}
#small-wins-lens .sw-form-actions button[type=submit]{padding:4px 9px;background:#e3eacb;color:#35523e;border-radius:4px}
@media(prefers-reduced-motion:no-preference){
#small-wins-lens .sw-stage.playing.more-sparkle .sw-extra{display:block;position:absolute;z-index:1;font-size:clamp(13px,2.5cqw,21px);font-style:normal;color:#fff9ae;text-shadow:0 1px 2px #81683e;opacity:0;animation:sw-flourish 1.15s ease-out both}
#small-wins-lens .sw-stage.playing.more-sparkle .g1,#small-wins-lens .sw-stage.playing.more-sparkle .g2,#small-wins-lens .sw-stage.playing.more-sparkle .g3{animation-duration:1s}
#small-wins-lens .sw-stage.playing.more-sparkle .x1{top:37%;right:12%;--dx:9px;--dy:4px}
#small-wins-lens .sw-stage.playing.more-sparkle .x2{top:-5%;left:24%;--dx:-4px;--dy:-9px}
#small-wins-lens .sw-stage.playing.more-sparkle .x3{top:46%;left:22%;--dx:-7px;--dy:5px}
#small-wins-lens .sw-stage.playing.more-sparkle .sw-halo{display:block;position:absolute;left:calc(50% - var(--unit)*.5);top:0;width:var(--unit);height:var(--unit);border:2px solid #ffeda6;border-radius:50%;animation:sw-halo 1.1s ease-out both}
#small-wins-lens .sw-stage.playing.more-sparkle .sw-plate{animation-name:sw-hop}
@keyframes sw-hop{0%{opacity:0;transform:scale(.75) rotate(-9deg)}11%{opacity:1;transform:scale(1.16) rotate(4deg)}19%,35%{opacity:1;transform:scale(1)}54%,100%{opacity:1;transform:translate(calc(var(--unit)*.30),calc(var(--unit)*.82)) scale(.465)}}
@keyframes sw-halo{0%{opacity:0;transform:scale(.63)}22%{opacity:.98}100%{opacity:0;transform:scale(1.58)}}
@keyframes sw-flourish{0%{opacity:0;transform:scale(.5)}27%{opacity:1}65%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.03)}}
}
@media(max-width:420px){#small-wins-lens .sw-stage[data-state=book]{min-height:275px}#small-wins-lens .sw-add-form input{font-size:16px}}

    <button type="button" class="sw-wrist cursor-interaction" hidden aria-label="Pinch the page tab to open your notebook"><span aria-hidden="true">▤</span> My notebook</button>
    <div class="sw-book" hidden role="group" aria-label="My notebook">
      <div class="sw-kicker">MY NOTEBOOK <button class="sw-close cursor-interaction" type="button" aria-label="Close notebook">×</button></div>
      <div class="sw-tabs">
        <button class="cursor-interaction" type="button" data-book="today" aria-pressed="true">Today</button>
        <button class="cursor-interaction" type="button" data-book="stickers" aria-pressed="false">Stickers</button>
      </div>
      <div class="sw-today">
        <div class="sw-section"><select class="cursor-interaction" aria-label="Choose a day"><option value="today">Today</option><option value="tomorrow">Tomorrow</option></select><span class="sw-count"></span></div>
        <div class="sw-rows"></div><div class="sw-pager" hidden><button type="button" class="cursor-interaction sw-prev" aria-label="Previous tasks">‹</button><span></span><button type="button" class="cursor-interaction sw-next" aria-label="Next tasks">›</button></div>
        <button class="sw-add cursor-interaction" type="button">+ Add my own task</button>
        <form class="sw-add-form" hidden><label>Your task<input required maxlength="54" type="text" aria-label="Your own task" placeholder="What counts for you?"></label>
        <label>Sticker category<select class="sw-category"><option value="self-care">Self-care</option><option value="home">Home</option><option value="exploring">Exploring</option></select></label>
        <div class="sw-form-actions"><button type="submit">Add task</button><button type="button" class="sw-cancel">Cancel</button></div></form>
      </div>
      <div class="sw-album" hidden><div class="sw-section">Today’s page</div><div class="sw-album-art"></div></div>
    </div>
    <div class="sw-quest" hidden>
      <div class="sw-kicker">OUTDOOR QUEST</div><div class="sw-quest-title">Find two<br>yellow things.</div>
      <div class="sw-quest-actions"><button type="button" class="cursor-interaction" data-quest="start">Start</button><button type="button" class="cursor-interaction" data-quest="later">Later</button></div>
    </div>
  </div>
  <div class="sw-controls">
    <div class="sw-scenes" role="group" aria-label="Preview scenes">
      <button type="button" class="cursor-interaction" data-go="quiet" aria-pressed="false">Quiet kitchen</button>
      <button type="button" class="cursor-interaction" data-go="win" aria-pressed="true">Second win</button>
      <button type="button" class="cursor-interaction" data-go="book" aria-pressed="false">Notebook</button>
      <button type="button" class="cursor-interaction" data-go="door" aria-pressed="false">Doorway</button>
    </div>
    <div class="sw-play-controls"><label class="sw-boost-label"><input type="checkbox" class="sw-boost"> More sparkle</label><button type="button" class="sw-action cursor-interaction">Replay the pop</button></div>
  </div>
  <div class="sw-status" aria-live="polite">The plate sticker appears beside the dishwasher. The mug was today’s first win.</div>
</div></main><script>
(()=>{
  const root=document.getElementById('small-wins-lens');
  const one=s=>root.querySelector(s);
  const all=s=>Array.from(root.querySelectorAll(s));
  const stage=one('.sw-stage'),reward=one('.sw-reward'),book=one('.sw-book'),wrist=one('.sw-wrist'),quest=one('.sw-quest'),status=one('.sw-status'),action=one('.sw-action');
  const boost=one('.sw-boost');
  const form=one('.sw-add-form'),input=form.querySelector('input'),daySelect=one('.sw-section select');
  const tea=one('.sw-mug'),plate=one('.sw-plate');
  const artFor={mug:tea.src,plate:plate.src};
  all('[data-art]').forEach(img=>{artFor[img.dataset.art]=img.src;});
  let state='win',timer,day='today',page=0,hand=false,section='today',questAnswer='';
  const days={today:[{name:'Make some tea',done:true,icon:'mug'},{name:'Load the dishwasher',done:true,icon:'plate'}],tomorrow:[]};
  const say=v=>{status.textContent=v};
  function refreshBook(){
    one('[data-book=today]').textContent=day==='today'?'Today':'Tomorrow';
    const tasks=days[day],count=tasks.filter(t=>t.done).length;
    one('.sw-count').textContent=count+' collected';
    const rows=one('.sw-rows');rows.replaceChildren();
    tasks.slice(page*2,page*2+2).forEach(task=>{
      const label=document.createElement('label'),check=document.createElement('input'),name=document.createElement('span');
      label.className='sw-row cursor-interaction';check.type='checkbox';check.checked=task.done;name.textContent=task.name;
      check.addEventListener('change',()=>{task.done=check.checked;refreshBook();one('.sw-rows').querySelectorAll('input')[Math.max(0,tasks.indexOf(task)-page*2)].focus();say(task.done?'Sticker added to your notebook.':'Task marked open.');});
      label.append(check,name);
      if(task.icon){const art=document.createElement('img');art.className='sw-row-art'+(task.done?'':' pending');art.alt='';art.src=artFor[task.icon];label.append(art)}
      rows.append(label);
    });
    if(!tasks.length){const empty=document.createElement('div');empty.className='sw-row';empty.textContent='An unwritten page.';rows.append(empty)}
    const pages=Math.ceil(tasks.length/2);
    one('.sw-pager').hidden=pages<2;
    one('.sw-pager span').textContent=(page+1)+' / '+pages;
    one('.sw-prev').disabled=page===0;one('.sw-next').disabled=page+1>=pages;
    const album=one('.sw-album-art');album.replaceChildren();
    one('.sw-album .sw-section').textContent=day==='today'?'Today’s page':'Tomorrow’s page';
    const mine=days[day].filter(t=>t.done);
    mine.slice(-4).forEach(t=>{
      if(t.icon){const img=document.createElement('img');img.alt=t.name;img.src=artFor[t.icon];album.append(img)}
      else{const icon=document.createElement('span');icon.className='sw-custom';icon.textContent='✿';icon.setAttribute('aria-label',t.name);album.append(icon)}
    });
    if(mine.length>4)album.append(document.createTextNode(' +'+(mine.length-4)+' more'));
    if(!mine.length)album.textContent='Your next sticker goes here.';
  }
  function setBookTab(s){
    section=s;
    all('[data-book]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.book===s));
    form.hidden=true;book.classList.remove('editing');one('.sw-add').hidden=false;
    one('.sw-today').hidden=s!=='today';one('.sw-album').hidden=s!=='stickers';
    refreshBook();
  }
  function change(next){
    clearTimeout(timer);stage.classList.remove('playing');state=next;stage.dataset.state=next;hand=false;
    wrist.hidden=true;one('.sw-hand').hidden=true;book.hidden=next!=='book';quest.hidden=next!=='door';reward.hidden=next!=='win';
    action.hidden=next==='book'||next==='door';action.disabled=false;
    form.hidden=true;book.classList.remove('editing');one('.sw-add').hidden=false;
    one('.sw-boost-label').hidden=next!=='win';
    all('[data-go]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.go===next));
    if(next==='win'){action.textContent='Replay the pop';say('The plate sticker appears beside the dishwasher. The mug was today’s first win.');}
    if(next==='quiet'){action.textContent='Raise hand';say('An ordinary kitchen, with the notebook tucked away.');}
    if(next==='book'){setBookTab(section);say('The notebook stays where you open it. Try adding a task for today or tomorrow.');}
    if(next==='door'){
      if(questAnswer){quest.hidden=true;action.hidden=false;action.textContent='Show quest again';say(questAnswer)}
      else{say('Standing still at the open door, you can accept the quest or leave it for later.');}
    }
  }
  function replay(){
    if(state!=='win')return;
    days.today[0].done=true;days.today[1].done=true;reward.hidden=false;
    stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing');
    say(boost.checked?'A gold ring opens around the plate. Six little stars lift, then the sticker settles beside the mug.':'Three stars open once. The plate settles beside the tea sticker.');action.disabled=true;
    timer=setTimeout(()=>{change('quiet');say('Both stickers are saved. Raise your hand to bring up the notebook tab.');},4700);
  }
  boost.addEventListener('change',()=>{stage.classList.toggle('more-sparkle',boost.checked);replay();});
  all('[data-go]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.go)));
  all('[data-book]').forEach(b=>b.addEventListener('click',()=>setBookTab(b.dataset.book)));
  all('[data-quest]').forEach(b=>b.addEventListener('click',()=>{
    questAnswer=b.dataset.quest==='start'?'Quest started. The doorway stays clear.':'Quest saved for later. The doorway stays clear.';
    change('door');
  }));
  action.addEventListener('click',()=>{
    if(state==='win'){replay();return}
    if(state==='door'){questAnswer='';change('door');return}
    if(state==='quiet'){hand=!hand;wrist.hidden=!hand;one('.sw-hand').hidden=!hand;action.textContent=hand?'Lower hand':'Raise hand';say(hand?'The page tab is within reach. Select it to simulate a pinch.':'An ordinary kitchen, with the notebook tucked away.');}
  });
  wrist.addEventListener('click',()=>{change('book');one('.sw-close').focus()});
  one('.sw-close').addEventListener('click',()=>{change('quiet');action.focus()});
  daySelect.addEventListener('change',()=>{day=daySelect.value;page=0;refreshBook()});
  one('.sw-add').addEventListener('click',()=>{book.classList.add('editing');form.hidden=false;one('.sw-add').hidden=true;input.focus()});
  one('.sw-prev').addEventListener('click',()=>{page--;refreshBook()});
  one('.sw-next').addEventListener('click',()=>{page++;refreshBook()});
  one('.sw-cancel').addEventListener('click',()=>{
    book.classList.remove('editing'); form.hidden=true; one('.sw-add').hidden=false; one('.sw-add').focus();
  });
  form.addEventListener('submit',e=>{
    e.preventDefault();const value=input.value.trim();if(!value){input.focus();return}
    book.classList.remove('editing');
    days[day].push({name:value,done:false,icon:one('.sw-category').value});page=Math.floor((days[day].length-1)/2);
    input.value='';form.hidden=true;one('.sw-add').hidden=false;refreshBook();say('Your task is on the page for '+day+'.');
  });
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state==='book'){change('quiet');action.focus()}});
})();
</script></body></html>
