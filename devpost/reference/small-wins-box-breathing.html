<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Small Wins · A minute on the sofa</title><style>html{color-scheme:light;background:#f8f5eb}body{margin:0;padding:clamp(14px,4vw,38px) clamp(10px,3vw,30px);font-family:system-ui,sans-serif}header,main{max-width:800px;margin:auto}header{margin-bottom:15px}header span{font:650 11px system-ui,sans-serif;letter-spacing:.14em;color:#8a583c}h1{color:#284939;font:normal clamp(29px,5vw,44px)/1.12 Georgia,serif;margin:5px 0}button,label{cursor:pointer}#sw-couch-breath{--fg:#244638;--fg-sub:#40594d;--btn:#295447;--on-btn:#fff9e9;--rule:#a5b7a8}</style><style>
#sw-couch-breath{--fg:light-dark(#23473d,#e1ece3);--fg-sub:light-dark(#4d6256,#c7d5cb);--btn:light-dark(#234f44,#bedec9);--on-btn:light-dark(#f7faed,#173b2f);--rule:light-dark(#9caf9e,#718777);max-width:800px;margin:0 auto;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
#sw-couch-breath *{box-sizing:border-box}
#sw-couch-breath [hidden]{display:none!important}
#sw-couch-breath .bx-room{position:relative;isolation:isolate;min-height:245px;aspect-ratio:750/420;overflow:hidden;border-radius:15px;background:#9da69a;container-type:inline-size}
#sw-couch-breath .bx-view{position:absolute;inset:0;height:100%;width:100%;object-fit:cover;object-position:center}
#sw-couch-breath .bx-room.is-soft .bx-view{filter:blur(3.5px) saturate(.76) brightness(.89);transition:filter .4s ease}
#sw-couch-breath .bx-square{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:clamp(135px,28cqw,205px);aspect-ratio:1;--stroke:clamp(5px,.95cqw,7px);--rim:#bdeed9;border:var(--stroke) solid var(--rim);border-radius:8px;background:rgba(45,117,108,.70);box-shadow:0 0 0 1px #35786a,0 2px 5px #244e3529,inset 0 0 0 1px #427866;color:#fff8df}
#sw-couch-breath .bx-track{position:absolute;inset:calc(var(--stroke) * -.5);border-radius:4px}
#sw-couch-breath .bx-guidance{position:absolute;inset:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;text-align:center;text-shadow:0 1px 2px #174f4e7a}
#sw-couch-breath .bx-round{font:600 11px/1.3 system-ui,sans-serif;letter-spacing:.09em;color:#e3f5dd}
#sw-couch-breath .bx-instruction{font:500 clamp(20px,3.6cqw,28px)/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.018em}
#sw-couch-breath .bx-count{min-height:17px;font:500 clamp(12px,1.85cqw,15px)/1.3 system-ui,sans-serif;color:#f5f3dd;font-variant-numeric:tabular-nums}
#sw-couch-breath .bx-dot{position:absolute;left:0;top:100%;width:clamp(17px,2.8cqw,23px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#ffe6a1;border:2px solid #66572d;box-shadow:inset 0 0 0 2px #fff3d2,0 0 0 2px #e8daae6e;pointer-events:none}
#sw-couch-breath .bx-prize{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:grid;justify-items:center;min-width:138px;color:#fff7e2;background:rgba(52,94,80,.92);border:1px solid #e2e8cb;border-radius:18px;padding:9px 16px 11px;line-height:1.3}
#sw-couch-breath .bx-art{position:relative;width:71px;height:65px}
#sw-couch-breath .bx-art img{height:100%;width:100%}
#sw-couch-breath .bx-star{position:absolute;color:#ffdf92;opacity:0;animation:bx-twinkle 1.3s ease-out .1s 1 both}
#sw-couch-breath .bx-star-a{top:4px;left:-4px}
#sw-couch-breath .bx-star-b{bottom:9px;right:-5px;animation-delay:.22s}
#sw-couch-breath .bx-prize strong{font-size:15px;font-weight:600}
#sw-couch-breath .bx-prize>span{font-size:12px}
#sw-couch-breath .bx-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin-top:10px}
#sw-couch-breath .bx-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#sw-couch-breath button{font:500 14px/1.35 system-ui,sans-serif;border:1px solid var(--rule);padding:7px 13px;border-radius:8px;color:var(--fg);background:transparent}
#sw-couch-breath .bx-primary{border-color:var(--btn);background:var(--btn);color:var(--on-btn)}
#sw-couch-breath .bx-focus{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--fg-sub);min-height:34px}
#sw-couch-breath .bx-soft{width:16px;height:16px;flex:0 0 16px;accent-color:#396a57}
#sw-couch-breath .bx-status{margin-top:4px;color:var(--fg-sub);font-size:13px;line-height:1.45}
@keyframes bx-twinkle{0%,100%{opacity:0}38%,60%{opacity:1}}
@media(prefers-reduced-motion:reduce){#sw-couch-breath .bx-room.is-soft .bx-view{transition:none}#sw-couch-breath .bx-star{animation:none}#sw-couch-breath .bx-room[data-state=running] .bx-dot{display:none}}
@media(pointer:coarse){#sw-couch-breath button,#sw-couch-breath .bx-focus{min-height:44px}}
</style></head><body><header><span>SMALL WINS · SEATED VIEW</span><h1>A minute on the sofa</h1></header><main><div id="sw-couch-breath" class="viz-dotted-background">

  let started=0,elapsed=0,boundary=-1,tick=-1,frame=0,rewardTimer=0;
  const state=()=>room.dataset.state;
  const setState=value=>{room.dataset.state=value};
  function putDot(x,y){dot.style.left=x+'%';dot.style.top=y+'%';}
  function clearScene(){soft.checked=false;room.classList.remove('is-soft');}
  function prepare(){
    clearTimeout(rewardTimer);cancelAnimationFrame(frame);clearScene();setState('ready');panel.hidden=false;reward.hidden=true;
    putDot(0,100);elapsed=0;boundary=-1;tick=-1;round.textContent='BOX BREATHING';cue.textContent='Follow the dot';count.textContent='4 counts per side';
    play.textContent='Begin';leave.textContent='Not now';leave.hidden=false;focus.hidden=false;status.textContent='Four rounds · 1 min 4 sec. Follow the pearl around the square.';
  }
  function finish(earned){
    cancelAnimationFrame(frame);clearTimeout(rewardTimer);clearScene();setState(earned?'complete':'room');panel.hidden=true;reward.hidden=!earned;focus.hidden=true;leave.hidden=true;play.textContent='Show breathing guide';
    status.textContent=earned?'Breathe normally. Your mindfulness sticker is on today’s page.':'The room is clear. Take your time.';
    if(earned)rewardTimer=setTimeout(()=>{reward.hidden=true;},4800);
  }
  function draw(now){
    elapsed=Math.max(0,now-started);
    if(elapsed>=laps*lapMs){finish(true);return}
    const edge=Math.floor(elapsed/sideMs),side=edge%4,lap=Math.floor(edge/4),fraction=elapsed/sideMs-edge;
    const a=corners[side],b=corners[(side+1)%4];
    putDot(a[0]+(b[0]-a[0])*fraction,a[1]+(b[1]-a[1])*fraction);
    if(edge!==boundary){boundary=edge;round.textContent='ROUND '+(lap+1)+' OF '+laps;cue.textContent=names[side];status.textContent='Round '+(lap+1)+' of '+laps+' · '+names[side]+'.';}
    const second=1+Math.floor(elapsed%sideMs/1000);
    if(second!==tick){tick=second;count.textContent=second+' of 4';}
    frame=requestAnimationFrame(draw);
  }
  function begin(){
    setState('running');started=performance.now()-elapsed;boundary=-1;tick=-1;focus.hidden=false;play.textContent='Pause';leave.textContent='Finish now';draw(performance.now());
  }
  function pause(){
    cancelAnimationFrame(frame);elapsed=Math.floor(elapsed/lapMs)*lapMs;clearScene();setState('paused');
    putDot(0,100);cue.textContent='Paused';count.textContent='Breathe normally';play.textContent='Restart round';focus.hidden=true;
    status.textContent='Take your time. Restart this round whenever you’re ready.';
  }
  play.addEventListener('click',()=>{
    if(state()==='running'){pause();return}
    if(state()==='ready'||state()==='paused'){begin();return}
    prepare();
  });
  leave.addEventListener('click',()=>finish(false));
  soft.addEventListener('change',()=>room.classList.toggle('is-soft',soft.checked));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state()==='running')pause()});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state()==='running'||state()==='paused'||state()==='ready'))finish(false)});
})();
</script></body></html>
